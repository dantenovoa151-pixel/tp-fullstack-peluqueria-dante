<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turnos Peluquería</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>Turnos de la Peluquería</h1>
  </header>

 <div id="mensaje-general" class="banner" style="display:none;"></div>
  <!-- Indicador visual de carga cuando se procesan peticiones -->
  <div id="loading" class="spinner" style="display:none;">Cargando...</div>

  <!--contenedor de la interfas-->
  <div class="container">
    <!--parte donde esta para crea o editar los turnos-->
    <section class="card-form">
      <h2 id="form-titulo">Nuevo Turno</h2>
      <form id="form-turno">
        <!--para guardar el id al editar un turno existente -->
        <input type="hidden" id="turno-id">

        <!--nombre del cliente -->
        <div class="form-group">
          <label for="cliente">Cliente:</label>
          <input type="text" id="cliente" required>
          <span class="error-text" id="error-cliente"></span>
        </div>

        <!--teléfono -->
        <div class="form-group">
          <label for="telefono">Teléfono:</label>
          <input type="text" id="telefono" required>
          <span class="error-text" id="error-telefono"></span>
        </div>

        <!--servicio a realizar -->
        <div class="form-group">
          <label for="servicio">Servicio:</label>
          <input type="text" id="servicio" required>
          <span class="error-text" id="error-servicio"></span>
        </div>

        <!--fecha del turno -->
        <div class="form-group">
          <label for="fecha">Fecha:</label>
          <input type="date" id="fecha" required>
          <span class="error-text" id="error-fecha"></span>
        </div>

        <!--hora del turno-->
        <div class="form-group">
          <label for="hora">Hora:</label>
          <input type="time" id="hora" required>
          <span class="error-text" id="error-hora"></span>
        </div>

        <!--precio del servicio-->
        <div class="form-group">
          <label for="precio">Precio:</label>
          <input type="number" step="0.01" id="precio" required>
          <span class="error-text" id="error-precio"></span>
        </div>

        <!--Estado del turno activo oi nactivo-->
        <div class="form-group checkbox">
          <label><input type="checkbox" id="activo" checked> Activo</label>
        </div>

        <!--botones de acción-->
        <button type="submit" id="btn-guardar">Guardar</button>
        <button type="button" id="btn-cancelar" style="display:none;">Cancelar</button>
      </form>
    </section>

    <!--parte de listado y filtrado de turnos -->
    <section class="card-list">
      <h2>Filtros</h2>
      <!--aca donde buscamos turnos por filtro-->
      <form id="form-filtros" class="grid-filtros">
        <input type="text" id="filtro-cliente" placeholder="Cliente">
        <input type="date" id="filtro-fecha">
        <input type="number" id="filtro-precio-min" placeholder="Precio mín">
        <input type="number" id="filtro-precio-max" placeholder="Precio máx">
        <button type="submit">Filtrar</button>
        <button type="button" id="btn-limpiar-filtros">Limpiar</button>
      </form>

      <h2>Listado de Turnos</h2>
      <!--aca es donde js renderiza las tarjetas de los turnos -->
      <div id="lista-turnos"></div>
    </section>
  </div>

  <!--entrada principal de javascript -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
